d7c">Thank you for your help.</text><circle cx="245" cy="312" r="13" fill="#d8cbb5"/><text x="267" y="310" font-size="12" font-family="Arial" fill="#25313a">Aisha Rahman</text><text x="267" y="328" font-size="9" font-family="Arial" fill="#727d7c">Can I change my order?</text><circle cx="245" cy="388" r="13" fill="#d8cbb5"/><text x="267" y="386" font-size="12" font-family="Arial" fill="#25313a">Daniel Wong</text><text x="267" y="404" font-size="9" font-family="Arial" fill="#727d7c">Do you deliver locally?</text><text x="485" y="198" font-size="11" font-family="Arial" fill="#25313a">Hi, is this still available?</text><text x="635" y="263" font-size="11" font-family="Arial" fill="#ffffff">Yes, how can we help?</text><text x="485" y="328" font-size="11" font-family="Arial" fill="#25313a">Could you share the details?</text><text x="635" y="393" font-size="11" font-family="Arial" fill="#ffffff">Of course. Here are the options.</text><rect x="470" y="460" width="360" height="35" rx="6" fill="#f6f6f2" stroke="#deded6"/><text x="485" y="482" font-size="11" font-family="Arial" fill="#8f9694">Type a reply…</text></svg>